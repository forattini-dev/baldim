      <rect x="876.4" y="132" width="108" height="30" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.11"/><text x="889.4" y="152" font-size="13" fill="#cbd5e1">boundaries</text><rect x="996.4" y="132" width="91.6" height="30" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.11"/><text x="1009.4" y="152" font-size="13" fill="#cbd5e1">own deps</text>
