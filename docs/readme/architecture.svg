<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-labelledby="title desc">
  <title id="title">Built to stay light</title>
  <desc id="desc">Core, adapters, plugins, packages — explicit boundaries.</desc>
  <defs>
    <linearGradient id="architecture-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#090b16"/>
    </linearGradient>
    <radialGradient id="architecture-glow" cx="0.2" cy="0.15" r="0.85">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="architecture-glow2" cx="0.8" cy="0.8" r="0.8">
