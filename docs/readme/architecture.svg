    <rect width="1200" height="190" fill="url(#architecture-grid)"/>
    <ellipse cx="110" cy="20" rx="340" ry="220" fill="url(#architecture-glow)"/>
    <ellipse cx="1110" cy="180" rx="330" ry="180" fill="url(#architecture-glow2)"/>

    <path d="M105 38l66 28-66 28-66-28z" fill="#8b5cf6" fill-opacity="0.24" stroke="#8b5cf6" stroke-width="3"/>
    <path d="M39 91l66 28 66-28M39 118l66 28 66-28" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <path d="M39 145l66 28 66-28" fill="none" stroke="#fbbf24" stroke-width="3"/>
