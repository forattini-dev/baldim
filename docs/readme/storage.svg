<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-labelledby="title desc">
  <title id="title">Pour data anywhere</title>
  <desc id="desc">Memory, files, SQL edges, object storage, and RedDB.</desc>
  <defs>
    <linearGradient id="storage-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#090b16"/>
    </linearGradient>
    <radialGradient id="storage-glow" cx="0.2" cy="0.15" r="0.85">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="storage-glow2" cx="0.8" cy="0.8" r="0.8">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="storage-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="storage-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#dbeafe" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="storage-frame"><rect width="1200" height="190" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#storage-frame)">
    <rect width="1200" height="190" fill="url(#storage-bg)"/>
    <rect width="1200" height="190" fill="url(#storage-grid)"/>
    <ellipse cx="110" cy="20" rx="340" ry="220" fill="url(#storage-glow)"/>
    <ellipse cx="1110" cy="180" rx="330" ry="180" fill="url(#storage-glow2)"/>

    <ellipse cx="106" cy="57" rx="52" ry="18" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3"/>
    <path d="M54 57v70c0 10 23 18 52 18s52-8 52-18V57" fill="#050914" stroke="#38bdf8" stroke-width="3"/>
    <path d="M54 91c0 10 23 18 52 18s52-8 52-18M54 123c0 10 23 18 52 18s52-8 52-18" fill="none" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="3"/>
    <circle cx="106" cy="57" r="7" fill="#fbbf24"/>
    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="215" y="54" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2.8">STORAGE ADAPTERS</text>
      <text x="215" y="105" font-size="43" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Pour data anywhere</text>
      <text x="215" y="142" font-size="18" fill="#94a3b8">Memory, files, SQL edges, object storage, and RedDB.</text>
      <rect x="851.8" y="132" width="108" height="30" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.11"/><text x="864.8" y="152" font-size="13" fill="#cbd5e1">5 packages</text><rect x="971.8" y="132" width="116.19999999999999" height="30" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.11"/><text x="984.8" y="152" font-size="13" fill="#cbd5e1">9 protocols</text>
    </g>
    <path d="M900 24c58 0 58 38 116 38s58-38 116-38" fill="none" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="900" cy="24" r="4" fill="#38bdf8"/><circle cx="1016" cy="62" r="4" fill="#8b5cf6"/><circle cx="1132" cy="24" r="4" fill="#fbbf24"/>
    <rect y="186" width="1200" height="4" fill="url(#storage-accent)"/>
