    <radialGradient id="partitions-glow" cx="0.2" cy="0.15" r="0.85"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.3"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="partitions-glow2" cx="0.8" cy="0.8" r="0.8"><stop offset="0" stop-color="#fb7185" stop-opacity="0.19"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
    <linearGradient id="partitions-accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <pattern id="partitions-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbeafe" stroke-opacity="0.035"/></pattern>
    <clipPath id="partitions-frame"><rect width="1200" height="190" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#partitions-frame)">
