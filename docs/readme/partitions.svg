    <ellipse cx="110" cy="20" rx="340" ry="220" fill="url(#partitions-glow)"/><ellipse cx="1110" cy="180" rx="330" ry="180" fill="url(#partitions-glow2)"/>
    <circle cx="61" cy="95" r="15" fill="#fbbf24"/><circle cx="137" cy="52" r="15" fill="#050914" stroke="#fb7185" stroke-width="3"/><circle cx="137" cy="95" r="15" fill="#050914" stroke="#22d3ee" stroke-width="3"/><circle cx="137" cy="138" r="15" fill="#050914" stroke="#4ade80" stroke-width="3"/>
