<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-labelledby="title desc">
  <title id="title">Design the path your queries take</title>
  <desc id="desc">Create indexed equality paths that work across storage adapters.</desc>
  <defs>
