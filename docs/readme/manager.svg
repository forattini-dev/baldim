<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-labelledby="title desc">
  <title id="title">One handle, many databases</title>
  <desc id="desc">Coordinate named connections without losing resource identity.</desc>
  <defs>
