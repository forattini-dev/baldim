version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /core
      - /adapters/*
      - /plugins/*
      - /packages/*
      - /apps/*
    schedule:
      interval: weekly
    groups:
      monorepo-dependencies:
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
