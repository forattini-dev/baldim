name: Provider contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BALDIM_AWS_S3_CONTRACT_URL: ${{ secrets.BALDIM_AWS_S3_CONTRACT_URL }}
      BALDIM_R2_CONTRACT_URL: ${{ secrets.BALDIM_R2_CONTRACT_URL }}
      BALDIM_REDDB_CONTRACT_URL: ${{ secrets.BALDIM_REDDB_CONTRACT_URL }}
      BALDIM_REDDB_COLLECTION: ${{ secrets.BALDIM_REDDB_COLLECTION }}
      BALDIM_REDDB_AUTH_TOKEN: ${{ secrets.BALDIM_REDDB_AUTH_TOKEN }}
      BALDIM_REDDB_WRITE_TOKEN: ${{ secrets.BALDIM_REDDB_WRITE_TOKEN }}
      BALDIM_LIBSQL_TEST_URL: ${{ secrets.BALDIM_LIBSQL_TEST_URL }}
      BALDIM_LIBSQL_AUTH_TOKEN: ${{ secrets.BALDIM_LIBSQL_AUTH_TOKEN }}
      BALDIM_D1_ACCOUNT_ID: ${{ secrets.BALDIM_D1_ACCOUNT_ID }}
      BALDIM_D1_DATABASE_ID: ${{ secrets.BALDIM_D1_DATABASE_ID }}
      BALDIM_D1_API_TOKEN: ${{ secrets.BALDIM_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: AWS S3 contract and persisted fixture
        if: ${{ env.BALDIM_AWS_S3_CONTRACT_URL != '' }}
        env:
          BALDIM_S3_CONTRACT_URL: ${{ env.BALDIM_AWS_S3_CONTRACT_URL }}
        run: pnpm --filter @baldim/adapter-s3 exec vitest run tests/storage-contract.test.ts tests/compatibility.test.ts
      - name: Cloudflare R2 contract and persisted fixture
        if: ${{ env.BALDIM_R2_CONTRACT_URL != '' }}
        env:
          BALDIM_S3_CONTRACT_URL: ${{ env.BALDIM_R2_CONTRACT_URL }}
        run: pnpm --filter @baldim/adapter-s3 exec vitest run tests/storage-contract.test.ts tests/compatibility.test.ts
      - name: RedDB contract
        if: ${{ env.BALDIM_REDDB_CONTRACT_URL != '' }}
        run: pnpm --filter @baldim/adapter-reddb exec vitest run tests/reddb-http-contract.test.ts
      - name: libSQL contract
        if: ${{ env.BALDIM_LIBSQL_TEST_URL != '' }}
        run: pnpm --filter @baldim/adapter-sqlite exec vitest run tests/remote-sqlite.test.ts
      - name: Cloudflare D1 contract
        if: ${{ env.BALDIM_D1_ACCOUNT_ID != '' && env.BALDIM_D1_DATABASE_ID != '' && env.BALDIM_D1_API_TOKEN != '' }}
        run: pnpm --filter @baldim/adapter-sqlite exec vitest run tests/remote-sqlite.test.ts
      - name: Require at least one configured provider
        if: ${{ env.BALDIM_AWS_S3_CONTRACT_URL == '' && env.BALDIM_R2_CONTRACT_URL == '' && env.BALDIM_REDDB_CONTRACT_URL == '' && env.BALDIM_LIBSQL_TEST_URL == '' && (env.BALDIM_D1_ACCOUNT_ID == '' || env.BALDIM_D1_DATABASE_ID == '' || env.BALDIM_D1_API_TOKEN == '') }}
        run: |
          echo 'Configure at least one provider-contract secret before dispatching this workflow.'
          exit 1
