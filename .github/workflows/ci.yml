name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:deps
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Run S3 contract against MinIO
        shell: bash
        env:
          BALDIN_S3_CONTRACT_URL: http://minioadmin:minioadmin@127.0.0.1:9000/baldin-contract?region=us-east-1&forcePathStyle=true
        run: |
          docker run --detach --name baldin-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs baldin-minio
              exit 1
            fi
            sleep 1
          done
          pnpm --filter @baldin/adapter-s3 exec vitest run tests/storage-contract.test.ts
      - name: Pack public packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-memory pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/core pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-filesystem pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-reddb pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-sqlite pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-s3 pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-audit pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-ttl pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-scheduler pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-fulltext pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-geo pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-graph pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-costs pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-metrics pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-queue-consumer pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-backup pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-cache pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-state-machine pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-tree pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-importer pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-vector pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-smtp pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-tournament pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-s3-queue pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-eventual-consistency pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-tfstate pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/testing pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/typegen pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
      - name: Verify S3 and Tfstate package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-s3-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-tfstate-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { S3Client } from '@baldin/adapter-s3';
          import { FilesystemTfStateDriver, S3TfStateDriver, TfStatePlugin } from '@baldin/plugin-tfstate';

          assert.equal(typeof S3Client, 'function');
          assert.equal(typeof FilesystemTfStateDriver, 'function');
          assert.equal(typeof S3TfStateDriver, 'function');
          assert.equal(typeof TfStatePlugin, 'function');
          JS
      - name: Verify packed packages in a clean consumer
        shell: bash
        run: |
          core=("$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz)
          memory=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz)
          filesystem=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-filesystem-*.tgz)
          reddb=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-reddb-*.tgz)
          sqlite=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-sqlite-*.tgz)
          adapter=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-s3-*.tgz)
          plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-audit-*.tgz)
          ttl_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-ttl-*.tgz)
          scheduler_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-scheduler-*.tgz)
          fulltext_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-fulltext-*.tgz)
          geo_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-geo-*.tgz)
          graph_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-graph-*.tgz)
          costs_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-costs-*.tgz)
          metrics_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-metrics-*.tgz)
          queue_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-queue-consumer-*.tgz)
          backup_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-backup-*.tgz)
          cache_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-cache-*.tgz)
          state_machine_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-state-machine-*.tgz)
          tree_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-tree-*.tgz)
          importer_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-importer-*.tgz)
          vector_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-vector-*.tgz)
          smtp_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-smtp-*.tgz)
          tournament_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-tournament-*.tgz)
          s3_queue_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-s3-queue-*.tgz)
          eventual_consistency_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-eventual-consistency-*.tgz)
          tfstate_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-tfstate-*.tgz)
          testing_package=("$GITHUB_WORKSPACE"/artifacts/baldin-testing-*.tgz)
          typegen_package=("$GITHUB_WORKSPACE"/artifacts/baldin-typegen-*.tgz)
          test "${#core[@]}" -eq 1
          test "${#memory[@]}" -eq 1
          test "${#filesystem[@]}" -eq 1
          test "${#reddb[@]}" -eq 1
          test "${#sqlite[@]}" -eq 1
          test "${#adapter[@]}" -eq 1
          test "${#plugin[@]}" -eq 1
          test "${#ttl_plugin[@]}" -eq 1
          test "${#scheduler_plugin[@]}" -eq 1
          test "${#fulltext_plugin[@]}" -eq 1
          test "${#geo_plugin[@]}" -eq 1
          test "${#graph_plugin[@]}" -eq 1
          test "${#costs_plugin[@]}" -eq 1
          test "${#metrics_plugin[@]}" -eq 1
          test "${#queue_plugin[@]}" -eq 1
          test "${#backup_plugin[@]}" -eq 1
          test "${#cache_plugin[@]}" -eq 1
          test "${#state_machine_plugin[@]}" -eq 1
          test "${#tree_plugin[@]}" -eq 1
          test "${#importer_plugin[@]}" -eq 1
          test "${#vector_plugin[@]}" -eq 1
          test "${#smtp_plugin[@]}" -eq 1
          test "${#tournament_plugin[@]}" -eq 1
          test "${#s3_queue_plugin[@]}" -eq 1
          test "${#eventual_consistency_plugin[@]}" -eq 1
          test "${#tfstate_plugin[@]}" -eq 1
          test "${#testing_package[@]}" -eq 1
          test "${#typegen_package[@]}" -eq 1
          if tar -tzf "${core[0]}" | grep -Eq 'package/dist/clients/(filesystem|memory|reddb|sqlite|remote-sqlite|d1|libsql)'; then
            echo "Core tarball contains a storage adapter implementation"
            exit 1
          fi
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "${memory[0]}" "${core[0]}" "${filesystem[0]}" "${reddb[0]}" "${sqlite[0]}" "${adapter[0]}" "${plugin[0]}" "${ttl_plugin[0]}" "${scheduler_plugin[0]}" "${fulltext_plugin[0]}" "${geo_plugin[0]}" "${graph_plugin[0]}" "${costs_plugin[0]}" "${metrics_plugin[0]}" "${queue_plugin[0]}" "${backup_plugin[0]}" "${cache_plugin[0]}" "${state_machine_plugin[0]}" "${tree_plugin[0]}" "${importer_plugin[0]}" "${vector_plugin[0]}" "${smtp_plugin[0]}" "${tournament_plugin[0]}" "${s3_queue_plugin[0]}" "${eventual_consistency_plugin[0]}" "${tfstate_plugin[0]}" "${testing_package[0]}" "${typegen_package[0]}"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { Baldin, encode, decode } from '@baldin/core';
          import { hasStorageAdapter } from '@baldin/core/adapter';
          import { encodeKey, decodeKey } from '@baldin/core/encoding';
          import { AuditPlugin } from '@baldin/plugin-audit';
          import { TTLPlugin } from '@baldin/plugin-ttl';
          import { SchedulerPlugin } from '@baldin/plugin-scheduler';
          import { FullTextPlugin } from '@baldin/plugin-fulltext';
          import { GeoPlugin } from '@baldin/plugin-geo';
          import { GraphPlugin } from '@baldin/plugin-graph';
          import { CostsPlugin } from '@baldin/plugin-costs';
          import { MetricsPlugin } from '@baldin/plugin-metrics';
          import { QueueConsumerPlugin } from '@baldin/plugin-queue-consumer';
          import { BackupPlugin } from '@baldin/plugin-backup';
          import { CachePlugin } from '@baldin/plugin-cache';
          import { StateMachinePlugin } from '@baldin/plugin-state-machine';
          import { TreePlugin } from '@baldin/plugin-tree';
          import { ImporterPlugin, Transformers } from '@baldin/plugin-importer';
          import { VectorPlugin } from '@baldin/plugin-vector';
          import { cosineDistance } from '@baldin/plugin-vector/distances';
          import { SMTPPlugin } from '@baldin/plugin-smtp';
          import { TournamentPlugin } from '@baldin/plugin-tournament';
          import { getAvailableFormats } from '@baldin/plugin-tournament/toolkit';
          import { S3QueuePlugin } from '@baldin/plugin-s3-queue';
          import { EventualConsistencyPlugin } from '@baldin/plugin-eventual-consistency';
          import { TfStatePlugin } from '@baldin/plugin-tfstate';
          import { Factory, Seeder } from '@baldin/testing';
          import { printTypes } from '@baldin/typegen';
          import { MemoryClient } from '@baldin/adapter-memory';
          import { isNodeSqliteAvailable } from '@baldin/adapter-sqlite';
          import { mkdtemp, rm, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import '@baldin/adapter-filesystem';
          import '@baldin/adapter-reddb';
          import '@baldin/adapter-s3';

          assert.equal(encode(62), '10');
          assert.equal(decode('10'), 62);
          assert.equal(encodeKey(36), '10');
          assert.equal(decodeKey('10'), 36);
          assert.equal(typeof MemoryClient.clearAllStorage, 'function');
          assert.equal(hasStorageAdapter('file'), true);
          assert.equal(hasStorageAdapter('reddb'), true);
          assert.equal(hasStorageAdapter('sqlite'), true);
          assert.equal(typeof isNodeSqliteAvailable(), 'boolean');
          assert.equal(hasStorageAdapter('s3'), true);
          assert.equal(new TTLPlugin({ enableCoordinator: false }).indexResourceName, 'plg_ttl_expiration_index');
          assert.equal(cosineDistance([1, 0], [1, 0]), 0);
          assert.ok(SMTPPlugin.getAvailableDrivers().includes('smtp'));
          assert.ok(getAvailableFormats().includes('single-elimination'));

          const database = new Baldin({ connectionString: 'memory://pack-smoke', logLevel: 'silent' });
          await database.connect();
          await database.usePlugin(new AuditPlugin());
          assert.ok(database.resources.plg_audits);
          let schedulerRuns = 0;
          const scheduler = new SchedulerPlugin({
            enableCoordinator: false,
            persistJobs: false,
            jobs: {
              smoke: {
                schedule: '@daily',
                enabled: false,
                action: async () => { schedulerRuns++; },
              },
            },
          });
          await database.usePlugin(scheduler);
          await scheduler.runJob('smoke');
          assert.equal(schedulerRuns, 1);
          const fulltext = new FullTextPlugin({ fields: { notes: ['title'] } });
          await database.usePlugin(fulltext);
          const notes = await database.createResource({ name: 'notes', attributes: { title: 'string|required' } });
          await notes.insert({ id: 'searchable', title: 'Packed Baldin search' });
          assert.equal((await fulltext.searchRecords('notes', 'baldin'))[0]?.id, 'searchable');
          const places = await database.createResource({
            name: 'places',
            attributes: { latitude: 'number|required', longitude: 'number|required' },
          });
          await database.usePlugin(new GeoPlugin({
            resources: { places: { latField: 'latitude', lonField: 'longitude', addGeohash: true } },
          }));
          await places.insert({ id: 'origin', latitude: 0, longitude: 0 });
          assert.equal((await places.findNearby({ lat: 0, lon: 0, radius: 1 }))[0]?.id, 'origin');
          const nodes = await database.createResource({
            name: 'nodes',
            attributes: { name: 'string|required' },
          });
          await database.createResource({
            name: 'edges',
            asyncPartitions: false,
            attributes: { source: 'string|required', target: 'string|required', label: 'string|optional' },
            partitions: {
              bySource: { fields: { source: 'string' } },
              byTarget: { fields: { target: 'string' } },
              byLabel: { fields: { label: 'string' } },
            },
          });
          await database.usePlugin(new GraphPlugin({ vertices: 'nodes', edges: 'edges' }));
          await nodes.insert({ id: 'a', name: 'A' });
          await nodes.insert({ id: 'b', name: 'B' });
          await nodes.graph.connect('a', 'b');
          assert.equal(await nodes.graph.isConnected('a', 'b'), true);
          const metrics = new MetricsPlugin({ flushInterval: 0, prometheus: { enabled: false } });
          await database.usePlugin(metrics);
          await nodes.get('a');
          assert.equal(metrics.metrics.operations.get.count, 1);
          assert.match(await metrics.getPrometheusMetrics(), /baldin_info/);
          const costs = new CostsPlugin();
          await database.usePlugin(costs);
          await database.client.putObject({ key: 'resource=pack/item', body: 'x' });
          assert.equal(costs.getCosts().provider, 'self-hosted');
          assert.equal(costs.getCosts().requests.counts.put, 1);
          const factory = Factory.define('pack-records', ({ seq }) => ({ id: `record-${seq}` }));
          assert.deepEqual(await factory.buildMany(2), [{ id: 'record-1' }, { id: 'record-2' }]);
          assert.equal(typeof Seeder, 'function');
          assert.match(await printTypes({ resources: { smoke: { attributes: { value: 'string|required' } } } }), /TypedResource<Smoke>/);
          let queueStopped = false;
          const queue = new QueueConsumerPlugin({
            drivers: [{ driver: 'fake', queues: [{ name: 'pack-queue', onMessage: async () => {} }] }],
            consumerFactory: async () => ({
              start: async () => {},
              stop: async () => { queueStopped = true; },
              publish: async data => data,
            }),
          });
          await database.usePlugin(queue);
          assert.deepEqual(await queue.publish('pack-queue', { packed: true }), { packed: true });
          const backupDir = await mkdtemp(path.join(tmpdir(), 'baldin-pack-backup-'));
          const backup = new BackupPlugin({
            logLevel: 'silent',
            config: { path: path.join(backupDir, 'store') },
            tempDir: path.join(backupDir, 'temp'),
          });
          await database.usePlugin(backup);
          const backupResult = await backup.backup('full', { resources: ['notes'] });
          assert.equal((await backup.getBackupStatus(backupResult.id)).status, 'completed');
          const cache = new CachePlugin({
            driver: 'memory',
            logLevel: 'silent',
            maxMemoryBytes: 1024 * 1024,
            methodPolicies: { get: { minHitsBeforeStore: 1 } },
          });
          await database.usePlugin(cache);
          await notes.get('searchable');
          await notes.get('searchable');
          assert.equal(cache.getStats().hits, 1);
          const stateMachine = new StateMachinePlugin({
            logLevel: 'silent',
            persistTransitions: false,
            stateMachines: {
              order: {
                initialState: 'pending',
                states: {
                  pending: { on: { PAY: 'paid' } },
                  paid: { type: 'final' },
                },
              },
            },
          });
          await database.usePlugin(stateMachine);
          await stateMachine.initializeEntity('order', 'pack-order');
          assert.equal((await stateMachine.send('order', 'pack-order', 'PAY')).to, 'paid');
          const categories = await database.createResource({
            name: 'categories',
            asyncPartitions: false,
            attributes: { name: 'string|required', parentId: 'string|optional' },
            partitions: { byParent: { fields: { parentId: 'string' } } },
          });
          await database.usePlugin(new TreePlugin({
            resources: ['categories'],
            driver: 'adjacency-list',
            logLevel: 'silent',
          }));
          const root = await categories.tree.createRoot({ name: 'Root' });
          await categories.tree.addChild(root.id, { name: 'Child' });
          assert.equal((await categories.tree.getDescendants(root.id))[0]?.name, 'Child');
          const importedUsers = await database.createResource({
            name: 'imported-users',
            attributes: { id: 'string|optional', name: 'string|required', email: 'string|required' },
          });
          const importer = new ImporterPlugin({
            resource: 'imported-users',
            format: 'csv',
            transforms: { email: Transformers.toLowerCase() },
          });
          await database.usePlugin(importer);
          const importDir = await mkdtemp(path.join(tmpdir(), 'baldin-pack-import-'));
          const importFile = path.join(importDir, 'users.csv');
          await writeFile(importFile, 'id,name,email\nu1,Ada,ADA@EXAMPLE.COM\n');
          assert.equal((await importer.import(importFile)).inserted, 1);
          assert.equal((await importedUsers.get('u1')).email, 'ada@example.com');
          const vectorDocuments = await database.createResource({
            name: 'vector-documents',
            attributes: { label: 'string|required', embedding: 'embedding:3' },
            behavior: 'body-overflow',
          });
          await database.usePlugin(new VectorPlugin({ dimensions: 3, logLevel: 'silent' }));
          await vectorDocuments.insert({ id: 'near', label: 'Near', embedding: [1, 0, 0] });
          await vectorDocuments.insert({ id: 'far', label: 'Far', embedding: [0, 1, 0] });
          assert.equal((await vectorDocuments.vectorSearch([1, 0, 0], {
            vectorField: 'embedding',
            limit: 2,
          }))[0]?.record.id, 'near');
          const tournaments = new TournamentPlugin({ logLevel: 'silent' });
          await database.usePlugin(tournaments);
          const packedTournament = await tournaments.create({
            name: 'Packed Cup',
            organizerId: 'pack-organizer',
            format: 'single-elimination',
            participantType: 'team',
          });
          assert.equal(packedTournament.status, 'draft');
          const queuedJobs = await database.createResource({
            name: 'queued-jobs',
            attributes: { task: 'string|required' },
          });
          await database.usePlugin(new S3QueuePlugin({
            resource: 'queued-jobs',
            autoStart: false,
            enableCoordinator: false,
            logLevel: 'silent',
          }));
          await queuedJobs.enqueue({ task: 'packed' });
          assert.equal((await queuedJobs.queueStats()).pending, 1);
          const counters = await database.createResource({
            name: 'counters',
            attributes: { value: 'number|default:0' },
          });
          const eventualConsistency = new EventualConsistencyPlugin({
            logLevel: 'silent',
            enableCoordinator: false,
            resources: { counters: ['value'] },
            consolidation: { mode: 'async', auto: false },
          });
          await database.usePlugin(eventualConsistency);
          await counters.insert({ id: 'pack-counter', value: 0 });
          await counters.add('pack-counter', 'value', 2);
          assert.deepEqual(
            await counters.consolidate('pack-counter', 'value'),
            { success: true, recordsProcessed: 1, transactionsApplied: 1, errors: [] },
          );
          assert.equal((await counters.get('pack-counter')).value, 2);
          const tfstateDir = await mkdtemp(path.join(tmpdir(), 'baldin-pack-tfstate-'));
          const tfstateFile = path.join(tfstateDir, 'terraform.tfstate');
          await writeFile(tfstateFile, JSON.stringify({
            version: 4,
            terraform_version: '1.9.0',
            serial: 1,
            lineage: 'pack-lineage',
            outputs: {},
            resources: [{
              mode: 'managed',
              type: 'aws_s3_bucket',
              name: 'pack',
              provider: 'provider["registry.terraform.io/hashicorp/aws"]',
              instances: [{ attributes: { id: 'pack-bucket' } }],
            }],
          }));
          const tfstate = new TfStatePlugin({ logLevel: 'silent', trackDiffs: false, asyncPartitions: false });
          await database.usePlugin(tfstate);
          assert.equal((await tfstate.importState(tfstateFile)).resourcesInserted, 1);
          assert.equal((await tfstate.getResourcesByType('aws_s3_bucket'))[0]?.resourceName, 'pack');
          await database.disconnect();
          await rm(backupDir, { recursive: true, force: true });
          await rm(importDir, { recursive: true, force: true });
          await rm(tfstateDir, { recursive: true, force: true });
          assert.equal(queueStopped, true);
          assert.equal(queuedJobs.enqueue, undefined);
          assert.equal(counters.add, undefined);
          JS
