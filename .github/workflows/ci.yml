          npm install --ignore-scripts --no-audit --no-fund "${memory[0]}" "${core[0]}" "${filesystem[0]}" "${reddb[0]}" "${sqlite[0]}" "${adapter[0]}" "${plugin[0]}" "${ttl_plugin[0]}" "${scheduler_plugin[0]}" "${fulltext_plugin[0]}" "${geo_plugin[0]}" "${graph_plugin[0]}" "${costs_plugin[0]}" "${metrics_plugin[0]}" "${queue_plugin[0]}" "${backup_plugin[0]}" "${cache_plugin[0]}" "${state_machine_plugin[0]}" "${tree_plugin[0]}" "${importer_plugin[0]}" "${vector_plugin[0]}" "${smtp_plugin[0]}" "${tournament_plugin[0]}" "${s3_queue_plugin[0]}" "${eventual_consistency_plugin[0]}" "${tfstate_plugin[0]}" "${api_plugin[0]}" "${identity_plugin[0]}" "${websocket_plugin[0]}" "${puppeteer_plugin[0]}" "${cookie_farm_plugin[0]}" "${cookie_farm_suite_plugin[0]}" "${kubernetes_inventory_plugin[0]}" "${ml_plugin[0]}" "${replicator_plugin[0]}" "${cloud_inventory_plugin[0]}" "${spider_plugin[0]}" "${recon_plugin[0]}" "${testing_package[0]}" "${typegen_package[0]}"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { Baldin, encode, decode } from '@baldin/core';
          import { hasStorageAdapter } from '@baldin/core/adapter';
          import { encodeKey, decodeKey } from '@baldin/core/encoding';
          import { AuditPlugin } from '@baldin/plugin-audit';
          import { TTLPlugin } from '@baldin/plugin-ttl';
          import { SchedulerPlugin } from '@baldin/plugin-scheduler';
          import { FullTextPlugin } from '@baldin/plugin-fulltext';
          import { GeoPlugin } from '@baldin/plugin-geo';
          import { GraphPlugin } from '@baldin/plugin-graph';
          import { CostsPlugin } from '@baldin/plugin-costs';
          import { MetricsPlugin } from '@baldin/plugin-metrics';
          import { QueueConsumerPlugin } from '@baldin/plugin-queue-consumer';
          import { BackupPlugin } from '@baldin/plugin-backup';
          import { CachePlugin } from '@baldin/plugin-cache';
          import { StateMachinePlugin } from '@baldin/plugin-state-machine';
          import { TreePlugin } from '@baldin/plugin-tree';
          import { ImporterPlugin, Transformers } from '@baldin/plugin-importer';
          import { VectorPlugin } from '@baldin/plugin-vector';
          import { cosineDistance } from '@baldin/plugin-vector/distances';
          import { SMTPPlugin } from '@baldin/plugin-smtp';
          import { TournamentPlugin } from '@baldin/plugin-tournament';
          import { getAvailableFormats } from '@baldin/plugin-tournament/toolkit';
          import { S3QueuePlugin } from '@baldin/plugin-s3-queue';
          import { EventualConsistencyPlugin } from '@baldin/plugin-eventual-consistency';
          import { TfStatePlugin } from '@baldin/plugin-tfstate';
          import { ApiPlugin } from '@baldin/plugin-api';
          import { IdentityPlugin } from '@baldin/plugin-identity';
          import { WebSocketPlugin } from '@baldin/plugin-websocket';
          import { PuppeteerPlugin } from '@baldin/plugin-puppeteer';
          import { CookieFarmPlugin } from '@baldin/plugin-cookie-farm';
          import { CookieFarmSuitePlugin } from '@baldin/plugin-cookie-farm-suite';
          import { KubernetesInventoryPlugin } from '@baldin/plugin-kubernetes-inventory';
          import { MLPlugin } from '@baldin/plugin-ml';
          import { ReplicatorPlugin } from '@baldin/plugin-replicator';
          import { CloudInventoryPlugin } from '@baldin/plugin-cloud-inventory';
          import { SpiderPlugin } from '@baldin/plugin-spider';
          import { ReconPlugin } from '@baldin/plugin-recon';
          import { Factory, Seeder } from '@baldin/testing';
