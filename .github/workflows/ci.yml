name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @buckiedb/core pack --pack-destination ../../artifacts
      - name: Verify packed package in a clean consumer
        shell: bash
        run: |
          packages=("$GITHUB_WORKSPACE"/artifacts/buckiedb-core-*.tgz)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "$package"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { encode, decode } from '@buckiedb/core';
          import { encodeKey, decodeKey } from '@buckiedb/core/encoding';
          assert.equal(encode(62), '10');
          assert.equal(decode('10'), 62);
          assert.equal(encodeKey(36), '10');
          assert.equal(decodeKey('10'), 36);
          JS
