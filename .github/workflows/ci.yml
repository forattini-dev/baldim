name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Run S3 contract against MinIO
        shell: bash
        env:
          BALDIN_S3_CONTRACT_URL: http://minioadmin:minioadmin@127.0.0.1:9000/baldin-contract?region=us-east-1&forcePathStyle=true
        run: |
          docker run --detach --name baldin-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs baldin-minio
              exit 1
            fi
            sleep 1
          done
          pnpm --filter @baldin/adapter-s3 exec vitest run tests/storage-contract.test.ts
      - name: Pack public packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-memory pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/core pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-filesystem pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-reddb pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-sqlite pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-s3 pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-audit pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-ttl pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-scheduler pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-fulltext pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-geo pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-graph pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-costs pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-metrics pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-queue-consumer pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/testing pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
      - name: Verify packed packages in a clean consumer
        shell: bash
        run: |
          core=("$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz)
          memory=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz)
          filesystem=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-filesystem-*.tgz)
          reddb=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-reddb-*.tgz)
          sqlite=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-sqlite-*.tgz)
          adapter=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-s3-*.tgz)
          plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-audit-*.tgz)
          ttl_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-ttl-*.tgz)
          scheduler_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-scheduler-*.tgz)
          fulltext_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-fulltext-*.tgz)
          geo_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-geo-*.tgz)
          graph_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-graph-*.tgz)
          costs_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-costs-*.tgz)
          metrics_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-metrics-*.tgz)
          queue_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-queue-consumer-*.tgz)
          testing_package=("$GITHUB_WORKSPACE"/artifacts/baldin-testing-*.tgz)
          test "${#core[@]}" -eq 1
          test "${#memory[@]}" -eq 1
          test "${#filesystem[@]}" -eq 1
          test "${#reddb[@]}" -eq 1
          test "${#sqlite[@]}" -eq 1
          test "${#adapter[@]}" -eq 1
          test "${#plugin[@]}" -eq 1
          test "${#ttl_plugin[@]}" -eq 1
          test "${#scheduler_plugin[@]}" -eq 1
          test "${#fulltext_plugin[@]}" -eq 1
          test "${#geo_plugin[@]}" -eq 1
          test "${#graph_plugin[@]}" -eq 1
          test "${#costs_plugin[@]}" -eq 1
          test "${#metrics_plugin[@]}" -eq 1
          test "${#queue_plugin[@]}" -eq 1
          test "${#testing_package[@]}" -eq 1
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "${memory[0]}" "${core[0]}" "${filesystem[0]}" "${reddb[0]}" "${sqlite[0]}" "${adapter[0]}" "${plugin[0]}" "${ttl_plugin[0]}" "${scheduler_plugin[0]}" "${fulltext_plugin[0]}" "${geo_plugin[0]}" "${graph_plugin[0]}" "${costs_plugin[0]}" "${metrics_plugin[0]}" "${queue_plugin[0]}" "${testing_package[0]}"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { Baldin, encode, decode } from '@baldin/core';
          import { hasStorageAdapter } from '@baldin/core/adapter';
          import { encodeKey, decodeKey } from '@baldin/core/encoding';
          import { AuditPlugin } from '@baldin/plugin-audit';
          import { TTLPlugin } from '@baldin/plugin-ttl';
          import { SchedulerPlugin } from '@baldin/plugin-scheduler';
          import { FullTextPlugin } from '@baldin/plugin-fulltext';
          import { GeoPlugin } from '@baldin/plugin-geo';
          import { GraphPlugin } from '@baldin/plugin-graph';
          import { CostsPlugin } from '@baldin/plugin-costs';
          import { MetricsPlugin } from '@baldin/plugin-metrics';
          import { QueueConsumerPlugin } from '@baldin/plugin-queue-consumer';
          import { Factory, Seeder } from '@baldin/testing';
          import { MemoryClient } from '@baldin/adapter-memory';
          import '@baldin/adapter-filesystem';
          import '@baldin/adapter-reddb';
          import '@baldin/adapter-sqlite';
          import '@baldin/adapter-s3';

          assert.equal(encode(62), '10');
          assert.equal(decode('10'), 62);
          assert.equal(encodeKey(36), '10');
          assert.equal(decodeKey('10'), 36);
          assert.equal(typeof MemoryClient.clearAllStorage, 'function');
          assert.equal(hasStorageAdapter('file'), true);
          assert.equal(hasStorageAdapter('reddb'), true);
          assert.equal(hasStorageAdapter('sqlite'), true);
          assert.equal(hasStorageAdapter('s3'), true);
          assert.equal(new TTLPlugin({ enableCoordinator: false }).indexResourceName, 'plg_ttl_expiration_index');

          const database = new Baldin({ connectionString: 'memory://pack-smoke', logLevel: 'silent' });
          await database.connect();
          await database.usePlugin(new AuditPlugin());
          assert.ok(database.resources.plg_audits);
          let schedulerRuns = 0;
          const scheduler = new SchedulerPlugin({
            enableCoordinator: false,
            persistJobs: false,
            jobs: {
              smoke: {
                schedule: '@daily',
                enabled: false,
                action: async () => { schedulerRuns++; },
              },
            },
          });
          await database.usePlugin(scheduler);
          await scheduler.runJob('smoke');
          assert.equal(schedulerRuns, 1);
          const fulltext = new FullTextPlugin({ fields: { notes: ['title'] } });
          await database.usePlugin(fulltext);
          const notes = await database.createResource({ name: 'notes', attributes: { title: 'string|required' } });
          await notes.insert({ id: 'searchable', title: 'Packed Baldin search' });
          assert.equal((await fulltext.searchRecords('notes', 'baldin'))[0]?.id, 'searchable');
          const places = await database.createResource({
            name: 'places',
            attributes: { latitude: 'number|required', longitude: 'number|required' },
          });
          await database.usePlugin(new GeoPlugin({
            resources: { places: { latField: 'latitude', lonField: 'longitude', addGeohash: true } },
          }));
          await places.insert({ id: 'origin', latitude: 0, longitude: 0 });
          assert.equal((await places.findNearby({ lat: 0, lon: 0, radius: 1 }))[0]?.id, 'origin');
          const nodes = await database.createResource({
            name: 'nodes',
            attributes: { name: 'string|required' },
          });
          await database.createResource({
            name: 'edges',
            asyncPartitions: false,
            attributes: { source: 'string|required', target: 'string|required', label: 'string|optional' },
            partitions: {
              bySource: { fields: { source: 'string' } },
              byTarget: { fields: { target: 'string' } },
              byLabel: { fields: { label: 'string' } },
            },
          });
          await database.usePlugin(new GraphPlugin({ vertices: 'nodes', edges: 'edges' }));
          await nodes.insert({ id: 'a', name: 'A' });
          await nodes.insert({ id: 'b', name: 'B' });
          await nodes.graph.connect('a', 'b');
          assert.equal(await nodes.graph.isConnected('a', 'b'), true);
          const metrics = new MetricsPlugin({ flushInterval: 0, prometheus: { enabled: false } });
          await database.usePlugin(metrics);
          await nodes.get('a');
          assert.equal(metrics.metrics.operations.get.count, 1);
          assert.match(await metrics.getPrometheusMetrics(), /baldin_info/);
          const costs = new CostsPlugin();
          await database.usePlugin(costs);
          await database.client.putObject({ key: 'resource=pack/item', body: 'x' });
          assert.equal(costs.getCosts().provider, 'self-hosted');
          assert.equal(costs.getCosts().requests.counts.put, 1);
          const factory = Factory.define('pack-records', ({ seq }) => ({ id: `record-${seq}` }));
          assert.deepEqual(await factory.buildMany(2), [{ id: 'record-1' }, { id: 'record-2' }]);
          assert.equal(typeof Seeder, 'function');
          let queueStopped = false;
          const queue = new QueueConsumerPlugin({
            drivers: [{ driver: 'fake', queues: [{ name: 'pack-queue', onMessage: async () => {} }] }],
            consumerFactory: async () => ({
              start: async () => {},
              stop: async () => { queueStopped = true; },
              publish: async data => data,
            }),
          });
          await database.usePlugin(queue);
          assert.deepEqual(await queue.publish('pack-queue', { packed: true }), { packed: true });
          await database.disconnect();
          assert.equal(queueStopped, true);
          JS
