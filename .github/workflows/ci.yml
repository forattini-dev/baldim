name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:deps
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Run S3 contract against MinIO
        shell: bash
        env:
          BALDIN_S3_CONTRACT_URL: http://minioadmin:minioadmin@127.0.0.1:9000/baldin-contract?region=us-east-1&forcePathStyle=true
        run: |
          docker run --detach --name baldin-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs baldin-minio
              exit 1
            fi
            sleep 1
          done
          pnpm --filter @baldin/adapter-s3 exec vitest run tests/storage-contract.test.ts
      - name: Pack public packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-memory pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/core pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-filesystem pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-reddb pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-sqlite pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/adapter-s3 pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-audit pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-ttl pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-scheduler pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-fulltext pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-geo pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-graph pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-costs pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-metrics pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-queue-consumer pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-backup pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-cache pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-state-machine pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-tree pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-importer pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-vector pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-smtp pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-tournament pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-s3-queue pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-eventual-consistency pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-tfstate pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-api pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-identity pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-websocket pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-puppeteer pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-cookie-farm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-cookie-farm-suite pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-kubernetes-inventory pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-ml pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-replicator pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-cloud-inventory pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-spider pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/plugin-recon pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/testing pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @baldin/typegen pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
      - name: Verify S3 and Tfstate package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-s3-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-tfstate-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { S3Client } from '@baldin/adapter-s3';
          import { FilesystemTfStateDriver, S3TfStateDriver, TfStatePlugin } from '@baldin/plugin-tfstate';

          assert.equal(typeof S3Client, 'function');
          assert.equal(typeof FilesystemTfStateDriver, 'function');
          assert.equal(typeof S3TfStateDriver, 'function');
          assert.equal(typeof TfStatePlugin, 'function');
          JS
      - name: Verify API package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-api-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { ApiPlugin } from '@baldin/plugin-api';

          const api = new ApiPlugin({ docs: { enabled: false }, startupBanner: false });
          assert.equal(typeof api.raffel.createRouter, 'function');
          assert.equal(typeof api.previewRuntime, 'function');
          JS
      - name: Verify Identity package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-audit-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-identity-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { IdentityPlugin } from '@baldin/plugin-identity';
          import { PasswordAuthDriver } from '@baldin/plugin-identity/drivers';

          const identity = new IdentityPlugin({
            resources: {
              users: { name: 'users' },
              tenants: { name: 'tenants' },
              clients: { name: 'oauth_clients' },
            },
            onboarding: { enabled: false },
            audit: { enabled: false },
            email: { enabled: false },
          });
          assert.equal(typeof identity.getIntegrationMetadata, 'function');
          assert.equal(typeof PasswordAuthDriver, 'function');
          JS
      - name: Verify WebSocket package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-websocket-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { Baldin } from '@baldin/core';
          import { WebSocketPlugin } from '@baldin/plugin-websocket';

          const database = new Baldin({ connectionString: 'memory://websocket-package', logLevel: 'silent' });
          const websocket = new WebSocketPlugin({
            host: '127.0.0.1',
            port: 0,
            logLevel: 'silent',
            startupBanner: false,
          });
          await database.connect();
          try {
            await database.usePlugin(websocket);
            const info = websocket.getServerInfo();
            assert.equal(info.isRunning, true);
            assert.ok('port' in info && info.port > 0);
            assert.equal((await fetch(`http://127.0.0.1:${info.port}/health`)).status, 200);
          } finally {
            await websocket.stop();
            await database.disconnect();
          }
          JS
      - name: Verify Puppeteer and CookieFarm package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-ttl-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-s3-queue-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-puppeteer-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-cookie-farm-[0-9]*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-cookie-farm-suite-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { Baldin } from '@baldin/core';
          import { CookieFarmPlugin } from '@baldin/plugin-cookie-farm';
          import { CookieFarmSuitePlugin } from '@baldin/plugin-cookie-farm-suite';
          import { CookieManager, ProxyManager, PuppeteerPlugin } from '@baldin/plugin-puppeteer';

          const plugin = new PuppeteerPlugin({ cookies: { enabled: false }, pool: { enabled: false } });
          await plugin._importDependencies();
          assert.equal(typeof plugin.puppeteer.launch, 'function');
          assert.equal(typeof plugin.createGhostCursor, 'function');
          assert.equal(typeof CookieManager, 'function');
          assert.equal(typeof ProxyManager, 'function');

          plugin._importDependencies = async () => {};
          const database = new Baldin({ connectionString: 'memory://cookie-farm-package', logLevel: 'silent' });
          await database.connect();
          await database.usePlugin(plugin);
          const farm = new CookieFarmPlugin({
            generation: { count: 0 },
            warmup: { enabled: false },
            stealth: { enabled: false },
            storage: { resource: 'packed_personas' },
            logLevel: 'silent',
          });
          await database.usePlugin(farm);
          assert.equal((await farm.generatePersonas(1)).length, 1);
          await database.disconnect();

          const suiteDatabase = new Baldin({ connectionString: 'memory://cookie-farm-suite-package', logLevel: 'silent' });
          await suiteDatabase.connect();
          const suite = new CookieFarmSuitePlugin({
            namespace: 'packed',
            queue: { autoStart: false },
            cookieFarm: {
              generation: { count: 0 },
              warmup: { enabled: false },
              stealth: { enabled: false },
            },
            pluginFactories: {
              puppeteer: options => {
                const child = new PuppeteerPlugin({
                  ...options,
                  cookies: { enabled: false },
                  proxy: { enabled: false },
                  pool: { enabled: false },
                });
                child._importDependencies = async () => {};
                return child;
              },
            },
          });
          await suiteDatabase.usePlugin(suite, 'packed-suite');
          assert.ok(suiteDatabase.resources.packed_persona_jobs);
          assert.ok(suiteDatabase.plugins['packed-cookie-farm']);
          assert.ok(suiteDatabase.plugins['packed-queue']);
          await suiteDatabase.disconnect();
          JS
      - name: Verify KubernetesInventory package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-kubernetes-inventory-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { Baldin } from '@baldin/core';
          import { KubernetesInventoryPlugin, formatResourceTypeId } from '@baldin/plugin-kubernetes-inventory';

          const driver = {
            initialize: async () => {},
            destroy: async () => {},
            discoverResourceTypes: async () => ['apps.v1.Deployment'],
            async *listResources() {
              yield {
                clusterId: 'packed', namespace: 'default', resourceType: 'apps.v1.Deployment',
                resourceId: 'web', configuration: { spec: { replicas: 1 } },
              };
            },
          };
          const database = new Baldin({ connectionString: 'memory://k8s-package', logLevel: 'silent' });
          const inventory = new KubernetesInventoryPlugin({
            clusters: [{ id: 'packed' }],
            driverFactory: () => driver,
            logLevel: 'silent',
          });
          await database.connect();
          await database.usePlugin(inventory, 'k8s');
          assert.equal((await inventory.getSnapshots()).length, 1);
          assert.equal(formatResourceTypeId({
            group: 'apps', version: 'v1', kind: 'Deployment', plural: 'deployments', namespaced: true, category: 'workload',
          }), 'apps.v1.Deployment');
          await database.disconnect();
          JS
      - name: Verify ML package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-ml-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import * as tf from '@tensorflow/tfjs';
          import { MLPlugin, RegressionModel } from '@baldin/plugin-ml';

          const plugin = new MLPlugin({ models: {} });
          const model = new RegressionModel({
            features: ['x'], target: 'y', minSamples: 2, logLevel: 'silent',
            modelConfig: { epochs: 2, batchSize: 2, validationSplit: 0 },
          });
          await model.train([{ x: 0, y: 1 }, { x: 1, y: 3 }]);
          assert.equal(typeof plugin.train, 'function');
          assert.equal(tf.version_core.startsWith('4.'), true);
          model.dispose();
          JS
      - name: Verify Replicator package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-replicator-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { ReplicatorPlugin, WebhookReplicator, loadDynamoDBReplicator, loadMongoDBReplicator } from '@baldin/plugin-replicator';
          import { DynamoDBClient } from '@aws-sdk/client-dynamodb';
          import { MongoClient } from 'mongodb';

          assert.equal(typeof ReplicatorPlugin, 'function');
          assert.equal(typeof WebhookReplicator, 'function');
          assert.equal(typeof await loadDynamoDBReplicator(), 'function');
          assert.equal(typeof await loadMongoDBReplicator(), 'function');
          assert.equal(typeof DynamoDBClient, 'function');
          assert.equal(typeof MongoClient, 'function');
          JS
      - name: Verify CloudInventory package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-cloud-inventory-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { CloudInventoryPlugin } from '@baldin/plugin-cloud-inventory';
          import { getDriver } from '@baldin/plugin-cloud-inventory/drivers';

          assert.equal(typeof CloudInventoryPlugin, 'function');
          assert.equal(typeof await getDriver('aws'), 'function');
          assert.equal(typeof await getDriver('azure'), 'function');
          assert.equal(typeof await getDriver('linode'), 'function');
          JS
      - name: Verify Spider package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-ttl-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-s3-queue-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-queue-consumer-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-puppeteer-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-spider-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { Baldin } from '@baldin/core';
          import { SpiderPlugin } from '@baldin/plugin-spider';
          import { CrawlContext } from '@baldin/plugin-spider/spider';
          import { createCrawlQueue } from '@baldin/plugin-spider/adapters';

          const database = new Baldin({ connectionString: 'memory://spider-package', logLevel: 'silent' });
          const spider = new SpiderPlugin({
            puppeteer: { enabled: false },
            queue: { autoStart: false },
            ttl: { enabled: false },
            crawlQueue: { driver: 'memory' },
            crawlStorage: { driver: 'memory' },
            logLevel: 'silent',
          });
          await database.connect();
          await database.usePlugin(spider, 'spider');
          assert.equal(spider.initialized, true);
          assert.equal(spider.config.crawlQueue.driver, 'memory');
          assert.equal(typeof CrawlContext, 'function');
          assert.equal(typeof createCrawlQueue, 'function');
          await database.disconnect();
          JS
      - name: Verify Recon package isolation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz \
            "$GITHUB_WORKSPACE"/artifacts/baldin-plugin-recon-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { Baldin } from '@baldin/core';
          import { ReconPlugin } from '@baldin/plugin-recon';
          import { DnsStage } from '@baldin/plugin-recon/stages';
          import { TargetNormalizer } from '@baldin/plugin-recon/concerns';

          const database = new Baldin({ connectionString: 'memory://recon-package', logLevel: 'silent' });
          const recon = new ReconPlugin({ behavior: 'passive', logLevel: 'silent' });
          recon.commandRunner.isRedBlueAvailable = async () => false;
          await database.connect();
          await database.usePlugin(recon, 'recon');
          const target = await recon.addTarget('example.com');
          assert.equal(recon.initialized, true);
          assert.equal(target.host, 'example.com');
          assert.equal(typeof DnsStage, 'function');
          assert.equal(typeof TargetNormalizer, 'function');
          await database.disconnect();
          JS
      - name: Verify packed packages in a clean consumer
        shell: bash
        run: |
          core=("$GITHUB_WORKSPACE"/artifacts/baldin-core-*.tgz)
          memory=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-memory-*.tgz)
          filesystem=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-filesystem-*.tgz)
          reddb=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-reddb-*.tgz)
          sqlite=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-sqlite-*.tgz)
          adapter=("$GITHUB_WORKSPACE"/artifacts/baldin-adapter-s3-*.tgz)
          plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-audit-*.tgz)
          ttl_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-ttl-*.tgz)
          scheduler_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-scheduler-*.tgz)
          fulltext_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-fulltext-*.tgz)
          geo_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-geo-*.tgz)
          graph_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-graph-*.tgz)
          costs_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-costs-*.tgz)
          metrics_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-metrics-*.tgz)
          queue_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-queue-consumer-*.tgz)
          backup_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-backup-*.tgz)
          cache_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-cache-*.tgz)
          state_machine_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-state-machine-*.tgz)
          tree_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-tree-*.tgz)
          importer_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-importer-*.tgz)
          vector_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-vector-*.tgz)
          smtp_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-smtp-*.tgz)
          tournament_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-tournament-*.tgz)
          s3_queue_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-s3-queue-*.tgz)
          eventual_consistency_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-eventual-consistency-*.tgz)
          tfstate_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-tfstate-*.tgz)
          api_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-api-*.tgz)
          identity_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-identity-*.tgz)
          websocket_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-websocket-*.tgz)
          puppeteer_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-puppeteer-*.tgz)
          cookie_farm_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-cookie-farm-[0-9]*.tgz)
          cookie_farm_suite_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-cookie-farm-suite-*.tgz)
          kubernetes_inventory_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-kubernetes-inventory-*.tgz)
          ml_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-ml-*.tgz)
          replicator_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-replicator-*.tgz)
          cloud_inventory_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-cloud-inventory-*.tgz)
          spider_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-spider-*.tgz)
          recon_plugin=("$GITHUB_WORKSPACE"/artifacts/baldin-plugin-recon-*.tgz)
          testing_package=("$GITHUB_WORKSPACE"/artifacts/baldin-testing-*.tgz)
          typegen_package=("$GITHUB_WORKSPACE"/artifacts/baldin-typegen-*.tgz)
          test "${#core[@]}" -eq 1
          test "${#memory[@]}" -eq 1
          test "${#filesystem[@]}" -eq 1
          test "${#reddb[@]}" -eq 1
          test "${#sqlite[@]}" -eq 1
          test "${#adapter[@]}" -eq 1
          test "${#plugin[@]}" -eq 1
          test "${#ttl_plugin[@]}" -eq 1
          test "${#scheduler_plugin[@]}" -eq 1
          test "${#fulltext_plugin[@]}" -eq 1
          test "${#geo_plugin[@]}" -eq 1
          test "${#graph_plugin[@]}" -eq 1
